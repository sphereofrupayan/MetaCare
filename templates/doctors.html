{% extends "base.html" %}
{% block content %}
<h1>Doctors</h1>
<div class="bar"><span></span><a class="btn" href="{{ url_for('add_doctor') }}">+ Add doctor</a></div>
<div class="card">
{% if rows %}
<table>
  <tr><th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th><th>Email</th><th></th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.doctor_id }}</td><td>{{ r.name }}</td><td>{{ r.specialization }}</td><td>{{ r.phone }}</td><td>{{ r.email or '-' }}</td>
    <td>
      <a class="btn sm sec" href="{{ url_for('edit_doctor', did=r.doctor_id) }}">Edit</a>
      <form class="inline" method="post" action="{{ url_for('delete_doctor', did=r.doctor_id) }}" data-confirm="Delete this doctor and related appointments/records?">
        <button class="btn sm danger">Delete</button></form>
    </td>
  </tr>
  {% endfor %}
</table>
{% else %}<p class="empty">No doctors yet.</p>{% endif %}
</div>
{% endblock %}
